[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://nodejs305.dszcbaross.edu.hu"
  status = 200
  force = true

[[redirects]]
  from = "/users/*"
  to = "https://nodejs305.dszcbaross.edu.hu"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://nodejs305.dszcbaross.edu.hu"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "https://nodejs305.dszcbaross.edu.hu"
  status = 200
  force = true

[[redirects]]
  from = "/logout"
  to = "https://nodejs305.dszcbaross.edu.hu"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200